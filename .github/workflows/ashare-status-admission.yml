name: A-share research - dated status admission

on:
  push:
    branches:
      - research/ashare-data-validation-20260907
    paths:
      - scripts/ashare_research/RUN_STATUS_ADMISSION

permissions:
  contents: read

concurrency:
  group: isolated-ashare-status-admission
  cancel-in-progress: false

jobs:
  status-admission:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Read only isolated research files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ashare_research
          fetch-depth: 1
      - name: Prepare bounded environment
        run: |
          mkdir -p "$RUNNER_TEMP/status-evidence"
          python3 -m venv "$RUNNER_TEMP/status-venv"
          "$RUNNER_TEMP/status-venv/bin/pip" install --disable-pip-version-check numpy==2.2.6 pandas==2.2.3 baostock==0.9.3
          "$RUNNER_TEMP/status-venv/bin/pip" freeze > "$RUNNER_TEMP/status-evidence/environment.txt"
      - name: Verify status causality and unchanged execution
        run: |
          set -o pipefail
          "$RUNNER_TEMP/status-venv/bin/python" -m unittest discover -s scripts/ashare_research -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/status-evidence/data-tests.txt"
          "$RUNNER_TEMP/status-venv/bin/python" -m unittest discover -s scripts/ashare_research -p 'checks_*.py' -v 2>&1 | tee "$RUNNER_TEMP/status-evidence/logic-tests.txt"
      - name: Acquire dated states and compare frozen rules
        run: |
          set -o pipefail
          "$RUNNER_TEMP/status-venv/bin/python" scripts/ashare_research/status_admission_study.py --source scripts/ashare_research/source.json --work "$RUNNER_TEMP/status-input" --output "$RUNNER_TEMP/status-evidence" 2>&1 | tee "$RUNNER_TEMP/status-evidence/run.log"
      - name: Preserve evidence even when the source fails
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/status-evidence/source"
          cp scripts/ashare_research/*.py "$RUNNER_TEMP/status-evidence/source/"
          cp scripts/ashare_research/source.json scripts/ashare_research/STATUS_ADMISSION_PLAN.md "$RUNNER_TEMP/status-evidence/source/"
          printf '%s\n' '${{ github.sha }}' > "$RUNNER_TEMP/status-evidence/commit.txt"
          if test -f "$RUNNER_TEMP/status-evidence/base_trades.csv.xz"; then
            "$RUNNER_TEMP/status-venv/bin/python" scripts/ashare_research/pack_exact.py pack "$RUNNER_TEMP/status-evidence/base_trades.csv.xz" "$RUNNER_TEMP/status-evidence/base_trades.exact.zip" > "$RUNNER_TEMP/status-evidence/packing.json"
            rm "$RUNNER_TEMP/status-evidence/base_trades.csv.xz"
          fi
          if test -f "$RUNNER_TEMP/status-evidence/report.md"; then
            cat "$RUNNER_TEMP/status-evidence/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Incomplete source or computation; no new performance claim.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Enforce fixed storage ceiling
        if: always()
        id: budget
        run: |
          python3 -c 'import os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"status-evidence"; n=sum(f.stat().st_size for f in p.rglob("*") if f.is_file()); print("Evidence bytes:",n); assert n<=33554432, "Evidence exceeds 32MiB; do not delete records to hide this"'
          echo 'ok=true' >> "$GITHUB_OUTPUT"
      - name: Retain bounded diagnostic evidence
        if: always() && steps.budget.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ashare-status-admission-${{ github.run_id }}
          path: ${{ runner.temp }}/status-evidence/
          if-no-files-found: error
          retention-days: 3
          compression-level: 9
