name: Apply broad sector history coverage on PR

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-sector-history-coverage-pr.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/sector-data-completeness-v2
          fetch-depth: 0

      - name: Apply source changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          config_py = Path("close_review_engine/src/ashare_review/sector_config.py")
          text = config_py.read_text(encoding="utf-8")
          text = text.replace(
              "    history_candidates_per_type: int\n"
              "    focus_concepts: tuple[FocusConcept, ...]\n",
              "    history_candidates_per_type: int\n"
              "    industry_history_candidates: int\n"
              "    concept_history_candidates: int\n"
              "    focus_concepts: tuple[FocusConcept, ...]\n",
              1,
          )
          text = text.replace(
              "    config = SectorMonitorConfig(\n",
              "    legacy_history_limit = int(payload.get(\"history_candidates_per_type\", 15))\n"
              "    config = SectorMonitorConfig(\n",
              1,
          )
          text = text.replace(
              "        history_candidates_per_type=int(payload.get(\"history_candidates_per_type\", 15)),\n",
              "        history_candidates_per_type=legacy_history_limit,\n"
              "        industry_history_candidates=int(\n"
              "            payload.get(\"industry_history_candidates\", legacy_history_limit)\n"
              "        ),\n"
              "        concept_history_candidates=int(\n"
              "            payload.get(\"concept_history_candidates\", legacy_history_limit)\n"
              "        ),\n",
              1,
          )
          text = text.replace(
              "    if not 1 <= config.max_detailed_boards <= 7:\n"
              "        raise ValueError(\"max_detailed_boards must be between 1 and 7\")\n"
              "    return config\n",
              "    if not 1 <= config.max_detailed_boards <= 7:\n"
              "        raise ValueError(\"max_detailed_boards must be between 1 and 7\")\n"
              "    if config.industry_history_candidates < 1:\n"
              "        raise ValueError(\"industry_history_candidates must be positive\")\n"
              "    if config.concept_history_candidates < 1:\n"
              "        raise ValueError(\"concept_history_candidates must be positive\")\n"
              "    return config\n",
              1,
          )
          if "industry_history_candidates" not in text:
              raise SystemExit("failed to update sector_config.py")
          config_py.write_text(text, encoding="utf-8")

          monitor = Path("close_review_engine/config/sector_monitor.yml")
          text = monitor.read_text(encoding="utf-8")
          if "industry_history_candidates:" not in text:
              text = text.replace(
                  "history_candidates_per_type: 15\n",
                  "history_candidates_per_type: 15\n"
                  "industry_history_candidates: 200\n"
                  "concept_history_candidates: 30\n",
                  1,
              )
          monitor.write_text(text, encoding="utf-8")

          review = Path("close_review_engine/src/ashare_review/sector_review.py")
          text = review.read_text(encoding="utf-8")
          old = (
              "    for board_type in (\"industry\", \"concept\"):\n"
              "        for row in _preliminary_sort(overview[board_type])[: config.history_candidates_per_type]:\n"
              "            history_targets[(board_type, str(row[\"board_code\"]))] = row\n"
          )
          new = (
              "    history_limits = {\n"
              "        \"industry\": config.industry_history_candidates,\n"
              "        \"concept\": config.concept_history_candidates,\n"
              "    }\n"
              "    for board_type in (\"industry\", \"concept\"):\n"
              "        for row in _preliminary_sort(overview[board_type])[: history_limits[board_type]]:\n"
              "            history_targets[(board_type, str(row[\"board_code\"]))] = row\n"
          )
          if old not in text:
              raise SystemExit("sector history target block not found")
          review.write_text(text.replace(old, new, 1), encoding="utf-8")

          validation = Path(
              ".github/workflows/a-share-close-review-sector-completeness.yml"
          )
          text = validation.read_text(encoding="utf-8")
          old = (
              "          top_history = [*industry[:15], *concept[:15]]\n"
              "          history_ready = sum(\n"
              "              row.get('return_5d') is not None\n"
              "              and row.get('return_20d') is not None\n"
              "              and row.get('amount_ratio_20') is not None\n"
              "              for row in top_history\n"
              "          )\n"
              "          proxy_history = sum(\n"
              "              '代理' in str(row.get('history_source') or '') for row in top_history\n"
              "          )\n"
          )
          new = (
              "          industry_history_ready = sum(\n"
              "              row.get('return_5d') is not None\n"
              "              and row.get('return_20d') is not None\n"
              "              and row.get('amount_ratio_20') is not None\n"
              "              for row in industry\n"
              "          )\n"
              "          concept_top30_history_ready = sum(\n"
              "              row.get('return_5d') is not None\n"
              "              and row.get('return_20d') is not None\n"
              "              and row.get('amount_ratio_20') is not None\n"
              "              for row in concept[:30]\n"
              "          )\n"
              "          top_history = [*industry, *concept[:30]]\n"
              "          proxy_history = sum(\n"
              "              '代理' in str(row.get('history_source') or '') for row in top_history\n"
              "          )\n"
          )
          if old not in text:
              raise SystemExit("validation history block not found")
          text = text.replace(old, new, 1)
          text = text.replace(
              "          assert history_ready >= 20, history_ready\n",
              "          assert industry_history_ready >= max(50, int(len(industry) * 0.65)), industry_history_ready\n"
              "          assert concept_top30_history_ready >= 20, concept_top30_history_ready\n",
              1,
          )
          text = text.replace(
              "              'top30_history_ready': history_ready,\n",
              "              'industry_history_ready': industry_history_ready,\n"
              "              'concept_top30_history_ready': concept_top30_history_ready,\n",
              1,
          )
          validation.write_text(text, encoding="utf-8")

          for path in (
              ".github/workflows/sector-taxonomy-conflict-diagnostic.yml",
              ".github/workflows/apply-sector-history-coverage.yml",
              ".github/workflows/apply-sector-history-coverage-pr.yml",
          ):
              Path(path).unlink(missing_ok=True)
          PY

      - name: Run focused verification
        working-directory: close_review_engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q \
            tests/test_sector_config.py \
            tests/test_sector_completeness.py \
            tests/test_sector_integrity.py
          python -m ruff check \
            src/ashare_review/sector_config.py \
            src/ashare_review/sector_review.py \
            tests/test_sector_config.py
          python -m compileall -q src tests

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            close_review_engine/config/sector_monitor.yml \
            close_review_engine/src/ashare_review/sector_config.py \
            close_review_engine/src/ashare_review/sector_review.py \
            close_review_engine/tests/test_sector_config.py \
            .github/workflows/a-share-close-review-sector-completeness.yml \
            .github/workflows/sector-taxonomy-conflict-diagnostic.yml \
            .github/workflows/apply-sector-history-coverage.yml \
            .github/workflows/apply-sector-history-coverage-pr.yml
          git commit -m "fix: broaden sector history coverage"
          git push origin HEAD:fix/sector-data-completeness-v2
