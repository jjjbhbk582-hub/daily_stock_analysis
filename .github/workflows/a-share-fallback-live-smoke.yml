name: A-share fallback live smoke

on:
  push:
    branches:
      - fix/a-share-data-fallbacks
    paths:
      - "close_review_engine/src/ashare_review/fallbacks.py"
      - "close_review_engine/src/ashare_review/engine.py"
      - "close_review_engine/scripts/run_live_smoke.py"
      - ".github/workflows/a-share-fallback-live-smoke.yml"
  workflow_dispatch:
    inputs:
      as_of:
        description: "交易日（YYYY-MM-DD）"
        required: true
        default: "2026-08-20"
        type: string

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: close_review_engine
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: close_review_engine/pyproject.toml
      - name: Install review engine
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Verify live fallback endpoints
        env:
          INPUT_AS_OF: ${{ inputs.as_of }}
        run: |
          target="${INPUT_AS_OF:-2026-08-20}"
          python scripts/run_live_smoke.py \
            --as-of "$target" \
            --stocks 3 \
            --require-market \
            --require-60m \
            | tee /tmp/a-share-fallback-live-smoke.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-share-fallback-live-smoke-${{ github.run_attempt }}
          path: /tmp/a-share-fallback-live-smoke.json
          if-no-files-found: warn
          retention-days: 14
