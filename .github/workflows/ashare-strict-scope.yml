name: A-share research - mandatory mainboard non-ST scope
on:
  push:
    branches: [research/ashare-data-validation-20260907]
    paths: [scripts/ashare_research/RUN_STRICT_SCOPE]
permissions:
  contents: read
  actions: read
concurrency:
  group: isolated-ashare-strict-scope
  cancel-in-progress: false
jobs:
  scope-study:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Read isolated research sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ashare_research
      - name: Reuse fixed completed historical state artifact
        uses: actions/download-artifact@v5
        with:
          artifact-ids: '10021194677'
          run-id: '34126772439'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/scope-seed
      - name: Prepare isolated numerical environment
        run: |
          mkdir -p "$RUNNER_TEMP/scope-evidence"
          python3 -m venv "$RUNNER_TEMP/scope-venv"
          "$RUNNER_TEMP/scope-venv/bin/pip" install --disable-pip-version-check numpy==2.2.6 pandas==2.2.3 baostock==0.9.3
          "$RUNNER_TEMP/scope-venv/bin/pip" freeze > "$RUNNER_TEMP/scope-evidence/environment.txt"
      - name: Test excluded boards and ST state changes
        run: |
          set -o pipefail
          "$RUNNER_TEMP/scope-venv/bin/python" -m unittest discover -s scripts/ashare_research -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/scope-evidence/data-tests.txt"
          "$RUNNER_TEMP/scope-venv/bin/python" -m unittest discover -s scripts/ashare_research -p 'checks_*.py' -v 2>&1 | tee "$RUNNER_TEMP/scope-evidence/logic-tests.txt"
      - name: Run fixed rules with mandatory user scope
        run: |
          set -o pipefail
          "$RUNNER_TEMP/scope-venv/bin/python" scripts/ashare_research/strict_scope_study.py --seed "$RUNNER_TEMP/scope-seed" --source scripts/ashare_research/source.json --work "$RUNNER_TEMP/scope-input" --output "$RUNNER_TEMP/scope-evidence" 2>&1 | tee "$RUNNER_TEMP/scope-evidence/run.log"
      - name: Preserve sources and all base trades without rounding
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/scope-evidence/source"
          cp scripts/ashare_research/*.py "$RUNNER_TEMP/scope-evidence/source/"
          cp scripts/ashare_research/{source.json,STRICT_SCOPE_PLAN.md} "$RUNNER_TEMP/scope-evidence/source/"
          printf '%s\n' '${{ github.sha }}' > "$RUNNER_TEMP/scope-evidence/commit.txt"
          if test -f "$RUNNER_TEMP/scope-evidence/base_trades.csv.xz"; then
            "$RUNNER_TEMP/scope-venv/bin/python" scripts/ashare_research/pack_exact.py pack "$RUNNER_TEMP/scope-evidence/base_trades.csv.xz" "$RUNNER_TEMP/scope-evidence/base_trades.exact.zip" > "$RUNNER_TEMP/scope-evidence/packing.json"
            rm "$RUNNER_TEMP/scope-evidence/base_trades.csv.xz"
          fi
          if test -f "$RUNNER_TEMP/scope-evidence/report.md"; then cat "$RUNNER_TEMP/scope-evidence/report.md" >> "$GITHUB_STEP_SUMMARY"; else echo 'No completed market result; inspect failed step.' >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Enforce bounded storage
        if: always()
        id: budget
        run: |
          python3 -c 'import os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"scope-evidence"; n=sum(f.stat().st_size for f in p.rglob("*") if f.is_file()); print("Evidence bytes:",n); assert n<=33554432'
          echo 'ok=true' >> "$GITHUB_OUTPUT"
      - name: Retain evidence, not price archive
        if: always() && steps.budget.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ashare-strict-scope-${{ github.run_id }}
          path: ${{ runner.temp }}/scope-evidence/
          retention-days: 3
          if-no-files-found: error
          compression-level: 9
