name: A-share sector completeness post-merge rerun

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/a-share-sector-completeness-production-rerun.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: a-share-sector-completeness-post-merge-rerun
  cancel-in-progress: false

jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    defaults:
      run:
        working-directory: close_review_engine
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: close_review_engine/pyproject.toml

      - name: Install review engine
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Run completed 2026-08-21 review
        id: review
        shell: bash
        run: |
          set -o pipefail
          ashare-review run \
            --as-of 2026-08-21 \
            --force \
            --output-root . \
            2>&1 | tee /tmp/production-rerun.log
          report_path="$(sed -n 's/^REPORT_PATH=//p' /tmp/production-rerun.log | head -n 1)"
          snapshot_path="$(sed -n 's/^SNAPSHOT_PATH=//p' /tmp/production-rerun.log | head -n 1)"
          ranking_path="$(sed -n 's/^RANKING_PATH=//p' /tmp/production-rerun.log | head -n 1)"
          echo "report_path=$report_path" >> "$GITHUB_OUTPUT"
          echo "snapshot_path=$snapshot_path" >> "$GITHUB_OUTPUT"
          echo "ranking_path=$ranking_path" >> "$GITHUB_OUTPUT"

      - name: Verify completed report and repaired fields
        id: verify
        shell: bash
        env:
          REPORT_PATH: ${{ steps.review.outputs.report_path }}
          SNAPSHOT_PATH: ${{ steps.review.outputs.snapshot_path }}
        run: |
          set -euo pipefail
          python scripts/verify_outputs.py . 2026-08-21
          python - <<'PY' | tee /tmp/production-summary.json
          import json
          import os
          from collections import defaultdict
          from pathlib import Path

          snapshot = json.loads(Path(os.environ["SNAPSHOT_PATH"]).read_text(encoding="utf-8"))
          report = Path(os.environ["REPORT_PATH"]).read_text(encoding="utf-8")
          assert snapshot["schema_version"] == 2
          assert snapshot["target_date"] == "2026-08-21"
          assert snapshot["valid_count"] == 17
          assert snapshot["universe_count"] == 17

          sectors = snapshot["sectors"]
          industry = sectors["industry_ranking"]
          concept = sectors["concept_ranking"]
          focus = sectors["focus_concepts"]
          dynamic = sectors["dynamic_candidates"]
          assert len(industry) >= 70
          assert len(concept) >= 100

          industry_breadth = sum(
              int(row.get("up_count") or 0) + int(row.get("down_count") or 0) > 0
              for row in industry
          )
          industry_history = sum(
              row.get("return_5d") is not None
              and row.get("return_20d") is not None
              and row.get("amount_ratio_20") is not None
              for row in industry
          )
          concept_top30_history = sum(
              row.get("return_5d") is not None
              and row.get("return_20d") is not None
              and row.get("amount_ratio_20") is not None
              for row in concept[:30]
          )
          assert industry_breadth >= max(50, int(len(industry) * 0.65)), industry_breadth
          assert industry_history >= max(50, int(len(industry) * 0.65)), industry_history
          assert concept_top30_history >= 20, concept_top30_history

          required_focus = {
              "AI算力", "CPO", "PCB", "半导体", "存储芯片", "稀土", "液冷服务器"
          }
          focus_by_label = {str(row.get("focus_label")): row for row in focus}
          missing = required_focus - set(focus_by_label)
          assert not missing, missing
          not_ready = {
              label: focus_by_label[label].get("status")
              for label in required_focus
              if focus_by_label[label].get("status") not in {"ready", "proxy_ready"}
          }
          assert not not_ready, not_ready

          bad_taxonomy = {
              "石油和天然气开采业", "食品制造业", "专用设备制造业"
          }
          assert not (bad_taxonomy & {str(row.get("board_name")) for row in industry})

          allowed = ("600", "601", "603", "605", "000", "001", "002", "003")
          by_board = defaultdict(list)
          for row in dynamic:
              code = str(row.get("code") or "")
              name = str(row.get("name") or "").upper()
              close = float(row.get("close") or 0)
              assert code.startswith(allowed), row
              assert 0 < close <= 100, row
              assert "ST" not in name and "退" not in name, row
              by_board[str(row.get("board_code") or row.get("board_name"))].append(row)
          for rows in by_board.values():
              codes = [str(row.get("code")) for row in rows]
              assert len(codes) == len(set(codes)), rows

          for heading in (
              "第一部分：市场环境",
              "第二部分：行业板块完整排名",
              "第三部分：重点概念板块",
              "第四部分：强势、上升与退潮板块",
              "第五部分：重点板块2+2",
              "第六部分：17只固定股票完整排名",
              "第七部分：固定池Top5重点分析",
              "第八部分：动态候选买点",
              "第九部分：与上一次排名对比",
              "第十部分：最终操作结论",
          ):
              assert heading in report, heading

          summary = {
              "target_date": snapshot["target_date"],
              "schema_version": snapshot["schema_version"],
              "valid_count": snapshot["valid_count"],
              "industry_count": len(industry),
              "industry_breadth_ready": industry_breadth,
              "industry_history_ready": industry_history,
              "concept_count": len(concept),
              "concept_top30_history_ready": concept_top30_history,
              "focus_status": {
                  label: focus_by_label[label].get("status")
                  for label in sorted(required_focus)
              },
              "dynamic_candidates": len(dynamic),
              "top_boards": [row.get("board_name") for row in sectors.get("top_boards", [])],
          }
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Commit verified report and state
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- data/processed data/state reports
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "data: update repaired sector 2+2 review 2026-08-21"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish verification comment
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "<!-- sector-completeness-post-merge-2026-08-21 -->"
            echo "## 2026-08-21板块完整度生产复盘"
            echo
            echo "- Run ID: ${{ github.run_id }}"
            echo "- 数据生成：${{ steps.review.outcome }}"
            echo "- 完整度校验：${{ steps.verify.outcome }}"
            echo "- 报告落库：${{ steps.persist.outcome }}"
            echo
            if [[ -f /tmp/production-summary.json ]]; then
              echo '```json'
              cat /tmp/production-summary.json
              echo '```'
            else
              echo '```text'
              cat /tmp/production-rerun.log
              echo '```'
            fi
          } > /tmp/production-comment.md
          gh pr comment 9 --body-file /tmp/production-comment.md

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-share-sector-completeness-production-2026-08-21-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            close_review_engine/reports/2026-08-21.md
            close_review_engine/data/processed/2026-08-21/
            close_review_engine/data/state/latest.json
            /tmp/production-rerun.log
            /tmp/production-summary.json
