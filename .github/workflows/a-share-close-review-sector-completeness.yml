name: A-share sector completeness validation

on:
  pull_request:
    paths:
      - "close_review_engine/**"
      - ".github/workflows/a-share-close-review-sector-completeness.yml"

permissions:
  contents: read

jobs:
  live-validation:
    if: github.head_ref == 'fix/sector-data-completeness-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: close_review_engine
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: close_review_engine/pyproject.toml

      - name: Install engine
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run isolated 2026-08-20 replay
        shell: bash
        run: |
          set -o pipefail
          rm -rf /tmp/sector-completeness-validation
          ashare-review run \
            --as-of 2026-08-20 \
            --force \
            --output-root /tmp/sector-completeness-validation \
            2>&1 | tee /tmp/sector-completeness.log

      - name: Verify completeness improvements
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_outputs.py /tmp/sector-completeness-validation 2026-08-20
          python - <<'PY'
          import json
          from pathlib import Path

          snapshot_path = Path('/tmp/sector-completeness-validation/data/processed/2026-08-20/snapshot.json')
          snapshot = json.loads(snapshot_path.read_text(encoding='utf-8'))
          sectors = snapshot['sectors']
          industry = sectors['industry_ranking']
          concept = sectors['concept_ranking']
          focus = sectors['focus_concepts']
          dynamic = sectors['dynamic_candidates']

          assert snapshot['schema_version'] == 2
          assert snapshot['valid_count'] == 17
          assert len(industry) >= 20
          assert len(concept) >= 20

          industry_breadth = sum(
              int(row.get('up_count') or 0) + int(row.get('down_count') or 0) > 0
              for row in industry
          )
          top_history = [*industry[:15], *concept[:15]]
          history_ready = sum(
              row.get('return_5d') is not None
              and row.get('return_20d') is not None
              and row.get('amount_ratio_20') is not None
              for row in top_history
          )
          proxy_history = sum('代理' in str(row.get('history_source') or '') for row in top_history)
          proxy_focus = [row for row in focus if row.get('status') == 'proxy_ready']
          potential_roles = [
              row for row in dynamic
              if row.get('role') in {'pullback_potential', 'breakout_potential'}
          ]

          assert industry_breadth >= max(20, int(len(industry) * 0.70)), industry_breadth
          assert history_ready >= 20, history_ready
          assert proxy_history >= 10, proxy_history
          assert len(proxy_focus) >= 5, proxy_focus
          assert len(potential_roles) >= 2, potential_roles

          summary = {
              'industry_count': len(industry),
              'concept_count': len(concept),
              'industry_breadth_ready': industry_breadth,
              'top30_history_ready': history_ready,
              'top30_proxy_history': proxy_history,
              'focus_proxy_ready': [row['focus_label'] for row in proxy_focus],
              'dynamic_candidates': len(dynamic),
              'potential_roles': [
                  f"{row.get('board_name')}:{row.get('role_label')}:{row.get('code')}"
                  for row in potential_roles
              ],
          }
          Path('/tmp/sector-completeness-summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          print(json.dumps(summary, ensure_ascii=False))
          PY

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sector-data-completeness-validation
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/sector-completeness-validation/reports/2026-08-20.md
            /tmp/sector-completeness-validation/data/processed/2026-08-20/
            /tmp/sector-completeness-summary.json
            /tmp/sector-completeness.log
