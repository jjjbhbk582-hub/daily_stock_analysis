name: Diagnose A-share fixed-stock source completeness

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/a-share-fixed-stock-source-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: close_review_engine
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: close_review_engine/pyproject.toml

      - name: Install engine
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Inspect all fixed-stock sources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/fixed-source-diagnostic.json
          from __future__ import annotations

          import json
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import date

          from ashare_review.config import load_universe
          from ashare_review.enhanced_data import ResilientLiveDataSource

          target = date(2026, 8, 21)
          stocks = load_universe("config/universe.yml")
          source = ResilientLiveDataSource(timeout=15)

          def inspect(stock):
              bundle = source.load_stock(stock, target)
              daily_last = None if bundle.daily.empty else bundle.daily["date"].max().isoformat()
              intraday_last = (
                  None if bundle.intraday_60m.empty else bundle.intraday_60m["date"].max().isoformat()
              )
              target_intraday = []
              if not bundle.intraday_60m.empty:
                  rows = bundle.intraday_60m[
                      bundle.intraday_60m["date"].dt.date == target
                  ]
                  target_intraday = [value.isoformat() for value in rows["date"].tolist()]
              return {
                  "code": stock.code,
                  "name": stock.name,
                  "valid_for_target": bundle.valid_for_target,
                  "daily_rows": len(bundle.daily),
                  "daily_last": daily_last,
                  "quote_date": None if bundle.quote is None else str(bundle.quote.data_date),
                  "quote_close": None if bundle.quote is None else bundle.quote.close,
                  "intraday_rows": len(bundle.intraday_60m),
                  "intraday_last": intraday_last,
                  "target_intraday_times": target_intraday,
                  "core_sources": bundle.core_sources,
                  "source_status": bundle.source_status,
              }

          output = []
          with ThreadPoolExecutor(max_workers=5) as executor:
              futures = {executor.submit(inspect, stock): stock for stock in stocks}
              for future in as_completed(futures):
                  output.append(future.result())
          output.sort(key=lambda row: row["code"])
          print(json.dumps({
              "target_date": target.isoformat(),
              "valid_count": sum(row["valid_for_target"] for row in output),
              "stocks": output,
          }, ensure_ascii=False, indent=2, default=str))
          PY

      - name: Publish diagnostic summary
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/fixed-source-comment.md
          import json
          from pathlib import Path

          path = Path('/tmp/fixed-source-diagnostic.json')
          print('<!-- fixed-stock-source-diagnostic-2026-08-21 -->')
          print('## 2026-08-21固定股票行情源诊断')
          print()
          if not path.exists():
              print('诊断文件未生成。')
              raise SystemExit
          data = json.loads(path.read_text(encoding='utf-8'))
          print(f"- 有效日线：{data['valid_count']}/17")
          print()
          print('| 股票 | 日线最后日期 | 腾讯报价日期 | 60分钟最后时间 | 有效 |')
          print('|---|---|---|---|---|')
          for row in data['stocks']:
              print(
                  f"| {row['name']} {row['code']} | {row['daily_last']} | "
                  f"{row['quote_date']} | {row['intraday_last']} | {row['valid_for_target']} |"
              )
          print()
          print('详细 source_status 已保存在工作流证据包。')
          PY
          gh pr comment 9 --body-file /tmp/fixed-source-comment.md

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-share-fixed-source-diagnostic-2026-08-21
          retention-days: 7
          path: /tmp/fixed-source-diagnostic.json
