name: Diagnose Eastmoney sector lists

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/sector-eastmoney-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-eastmoney:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Eastmoney board lists and history
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import urllib.parse
          import urllib.request

          HEADERS = {
              "User-Agent": "Mozilla/5.0",
              "Referer": "https://quote.eastmoney.com/center/boardlist.html",
          }
          hosts = (
              "https://79.push2.eastmoney.com/api/qt/clist/get",
              "https://17.push2.eastmoney.com/api/qt/clist/get",
              "https://push2.eastmoney.com/api/qt/clist/get",
          )

          def get_json(url: str, params: dict[str, object]) -> tuple[int, object]:
              request = urllib.request.Request(
                  f"{url}?{urllib.parse.urlencode(params)}", headers=HEADERS
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return response.status, json.loads(response.read().decode("utf-8"))
              except Exception as exc:
                  return 0, f"{type(exc).__name__}: {exc}"

          base = {
              "po": 1,
              "np": 1,
              "fltt": 2,
              "invt": 2,
              "fid": "f12",
              "fields": "f2,f3,f6,f8,f12,f14,f20,f104,f105,f124,f128,f136",
              "ut": "bd1d9ddb04089700cf9c27f6f7426281",
          }
          for board_type, fs in (
              ("industry", "m:90 t:2 f:!50"),
              ("concept", "m:90 t:3 f:!50"),
          ):
              for host in hosts:
                  for pz in (100, 500):
                      for page in (1, 2):
                          params = dict(base, fs=fs, pz=pz, pn=page)
                          status, payload = get_json(host, params)
                          print("LIST", board_type, host, "pz", pz, "pn", page, "status", status)
                          if not isinstance(payload, dict):
                              print(payload)
                              continue
                          data = payload.get("data") or {}
                          diff = data.get("diff") or []
                          print(" total", data.get("total"), "rows", len(diff))
                          print(" first", [(x.get("f12"), x.get("f14"), x.get("f104"), x.get("f105")) for x in diff[:3]])
                          print(" last", [(x.get("f12"), x.get("f14")) for x in diff[-3:]])
                  break

          print("=== HISTORY ===")
          for code in ("BK0465", "BK0481", "BK1027"):
              for host in (
                  "https://91.push2his.eastmoney.com/api/qt/stock/kline/get",
                  "https://push2his.eastmoney.com/api/qt/stock/kline/get",
              ):
                  status, payload = get_json(
                      host,
                      {
                          "secid": f"90.{code}",
                          "fields1": "f1,f2,f3,f4,f5,f6",
                          "fields2": "f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61",
                          "klt": 101,
                          "fqt": 0,
                          "beg": 0,
                          "end": "20260820",
                          "smplmt": 10000,
                          "lmt": 30,
                      },
                  )
                  print("HISTORY", code, host, status)
                  if isinstance(payload, dict):
                      data = payload.get("data") or {}
                      rows = data.get("klines") or []
                      print(" name", data.get("name"), "rows", len(rows), "last", rows[-2:])
                  else:
                      print(payload)
                  break
          PY
