name: A-share research - resumable dated status V2
on:
  push:
    branches: [research/ashare-data-validation-20260907]
    paths: [scripts/ashare_research/RUN_STATUS_RESUME_V2]
permissions:
  contents: read
  actions: read
concurrency:
  group: isolated-ashare-status-resume-v2
  cancel-in-progress: false
jobs:
  resume-status:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Read only research sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ashare_research
      - name: Read original immutable completed status artifact
        uses: actions/download-artifact@v5
        with:
          artifact-ids: '10014861097'
          run-id: '34110915846'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/status-seed-a
      - name: Read the already-completed additional export
        uses: actions/download-artifact@v5
        with:
          artifact-ids: '10016961250'
          run-id: '34117138504'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/status-seed-t
      - name: Prepare bounded environment
        run: |
          mkdir -p "$RUNNER_TEMP/status-resume-evidence"
          python3 -m venv "$RUNNER_TEMP/status-resume-venv"
          "$RUNNER_TEMP/status-resume-venv/bin/pip" install --disable-pip-version-check numpy==2.2.6 pandas==2.2.3 baostock==0.9.3
          "$RUNNER_TEMP/status-resume-venv/bin/pip" freeze > "$RUNNER_TEMP/status-resume-evidence/environment.txt"
      - name: Run data, recovery, causality and ledger checks
        run: |
          set -o pipefail
          "$RUNNER_TEMP/status-resume-venv/bin/python" -m unittest discover -s scripts/ashare_research -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/status-resume-evidence/data-tests.txt"
          "$RUNNER_TEMP/status-resume-venv/bin/python" -m unittest discover -s scripts/ashare_research -p 'checks_*.py' -v 2>&1 | tee "$RUNNER_TEMP/status-resume-evidence/logic-tests.txt"
      - name: Resume missing histories and rerun unchanged diagnostic
        run: |
          set -o pipefail
          "$RUNNER_TEMP/status-resume-venv/bin/python" scripts/ashare_research/status_resume_v2.py \
            --seed-a "$RUNNER_TEMP/status-seed-a" --seed-t "$RUNNER_TEMP/status-seed-t" \
            --seeds scripts/ashare_research/STATUS_RESUME_SEEDS.json \
            --source scripts/ashare_research/source.json \
            --work "$RUNNER_TEMP/status-resume-input" --output "$RUNNER_TEMP/status-resume-evidence" \
            --workers 4 --seconds 900 2>&1 | tee "$RUNNER_TEMP/status-resume-evidence/run.log"
      - name: Preserve checkpoints and reproduction sources
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/status-resume-evidence/source"
          cp scripts/ashare_research/*.py "$RUNNER_TEMP/status-resume-evidence/source/"
          cp scripts/ashare_research/{STATUS_RESUME_V2_PLAN.md,STATUS_RESUME_SEEDS.json,source.json} "$RUNNER_TEMP/status-resume-evidence/source/"
          printf '%s\n' '${{ github.sha }}' > "$RUNNER_TEMP/status-resume-evidence/commit.txt"
          if test -f "$RUNNER_TEMP/status-resume-evidence/diagnostic/base_trades.csv.xz"; then
            "$RUNNER_TEMP/status-resume-venv/bin/python" scripts/ashare_research/pack_exact.py pack "$RUNNER_TEMP/status-resume-evidence/diagnostic/base_trades.csv.xz" "$RUNNER_TEMP/status-resume-evidence/diagnostic/base_trades.exact.zip" > "$RUNNER_TEMP/status-resume-evidence/packing.json"
            rm "$RUNNER_TEMP/status-resume-evidence/diagnostic/base_trades.csv.xz"
          fi
          if test -f "$RUNNER_TEMP/status-resume-evidence/diagnostic/report.md"; then
            cat "$RUNNER_TEMP/status-resume-evidence/diagnostic/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Incomplete collection or calculation; retained checkpoints are not a strategy certificate.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Enforce 32 MiB output ceiling
        id: size
        if: always()
        run: |
          python3 -c 'import pathlib,os; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"status-resume-evidence"; n=sum(f.stat().st_size for f in p.rglob("*") if f.is_file()); print("Evidence bytes:",n); assert n<=33554432, "Evidence too large; no silent deletion"'
          echo 'ok=true' >> "$GITHUB_OUTPUT"
      - name: Retain bounded outputs only
        if: always() && steps.size.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ashare-status-resume-v2-${{ github.run_id }}
          path: ${{ runner.temp }}/status-resume-evidence/
          retention-days: 3
          compression-level: 9
          if-no-files-found: error
