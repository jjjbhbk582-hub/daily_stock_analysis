name: A-share close review engine CI

on:
  push:
    paths:
      - "close_review_engine/**"
      - ".github/workflows/a-share-close-review*.yml"
  pull_request:
    paths:
      - "close_review_engine/**"
      - ".github/workflows/a-share-close-review*.yml"

permissions:
  contents: write

jobs:
  apply-sector-quality-patch:
    if: github.ref == 'refs/heads/feat/sector-2plus2-monitoring'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/sector-2plus2-monitoring
          fetch-depth: 0

      - name: Detect pending patch
        id: patch
        run: |
          if [[ -f close_review_engine/.sector-quality.patch ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply taxonomy quality patch
        if: steps.patch.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git apply --check close_review_engine/.sector-quality.patch
          git apply close_review_engine/.sector-quality.patch

      - name: Set up Python
        if: steps.patch.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: close_review_engine/pyproject.toml

      - name: Install and verify
        if: steps.patch.outputs.ready == 'true'
        working-directory: close_review_engine
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q
          python -m ruff check .
          python -m compileall -q src scripts tests
          rm -rf /tmp/sector-2plus2-quality-fixture
          ashare-review run \
            --as-of 2026-08-20 \
            --force \
            --fixture config/review_fixture.yml \
            --output-root /tmp/sector-2plus2-quality-fixture
          python scripts/verify_outputs.py /tmp/sector-2plus2-quality-fixture 2026-08-20

      - name: Commit verified patch
        if: steps.patch.outputs.ready == 'true'
        run: |
          set -euo pipefail
          rm close_review_engine/.sector-quality.patch
          rm -f .github/workflows/apply-sector-quality-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: validate sector taxonomy completeness"
          git push origin HEAD:feat/sector-2plus2-monitoring

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: close_review_engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: close_review_engine/pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run static checks
        run: python -m ruff check . && python -m compileall -q src scripts tests

      - name: Check CLI
        run: ashare-review --help

      - name: Run deterministic 17-stock end-to-end fixture
        run: |
          rm -rf /tmp/a-share-close-review-ci
          ashare-review run \
            --as-of 2026-08-20 \
            --force \
            --fixture config/review_fixture.yml \
            --output-root /tmp/a-share-close-review-ci
          python scripts/verify_outputs.py /tmp/a-share-close-review-ci 2026-08-20

  market-completeness-live-smoke:
    if: >-
      github.ref == 'refs/heads/fix/a-share-market-completeness' ||
      github.head_ref == 'fix/a-share-market-completeness'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: close_review_engine
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: close_review_engine/pyproject.toml

      - name: Install review engine
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Verify live market and 60-minute completeness
        run: |
          set -o pipefail
          python scripts/run_live_smoke.py \
            --as-of 2026-08-20 \
            --stocks 3 \
            --require-market \
            --require-daily \
            --require-60m \
            | tee /tmp/a-share-market-completeness-live-smoke.json

      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-share-market-completeness-live-smoke-${{ github.run_attempt }}
          path: /tmp/a-share-market-completeness-live-smoke.json
          if-no-files-found: warn
          retention-days: 14

  sector-live-smoke:
    if: >-
      github.ref == 'refs/heads/feat/sector-2plus2-monitoring' ||
      github.head_ref == 'feat/sector-2plus2-monitoring'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: close_review_engine
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: close_review_engine/pyproject.toml

      - name: Install review engine
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Verify live sector panorama and 2+2 candidates
        run: |
          set -o pipefail
          python scripts/run_sector_live_smoke.py \
            --workers 8 \
            | tee /tmp/a-share-sector-live-smoke.json

      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-share-sector-live-smoke-${{ github.run_attempt }}
          path: /tmp/a-share-sector-live-smoke.json
          if-no-files-found: warn
          retention-days: 14
