name: A-share research - fixed volume shock mechanisms
on:
  push:
    branches: [research/ashare-data-validation-20260907]
    paths: [scripts/ashare_research/RUN_VOLUME_SHOCK]
permissions:
  contents: read
  actions: read
concurrency:
  group: isolated-ashare-volume-shock
  cancel-in-progress: false
jobs:
  volume-shock:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Read only isolated research code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ashare_research
      - name: Reuse immutable completed historical states
        uses: actions/download-artifact@v5
        with:
          artifact-ids: '10021194677'
          run-id: '34126772439'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/volume-seed
      - name: Prepare bounded numerical environment
        run: |
          mkdir -p "$RUNNER_TEMP/volume-evidence"
          python3 -m venv "$RUNNER_TEMP/volume-venv"
          "$RUNNER_TEMP/volume-venv/bin/pip" install --disable-pip-version-check numpy==2.2.6 pandas==2.2.3 baostock==0.9.3
          "$RUNNER_TEMP/volume-venv/bin/pip" freeze > "$RUNNER_TEMP/volume-evidence/environment.txt"
      - name: Verify prior-window and hard-scope logic
        run: |
          set -o pipefail
          "$RUNNER_TEMP/volume-venv/bin/python" -m unittest discover -s scripts/ashare_research -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/volume-evidence/data-tests.txt"
          "$RUNNER_TEMP/volume-venv/bin/python" -m unittest discover -s scripts/ashare_research -p 'checks_*.py' -v 2>&1 | tee "$RUNNER_TEMP/volume-evidence/logic-tests.txt"
      - name: Run all frozen volume rules and execution scenarios
        run: |
          set -o pipefail
          "$RUNNER_TEMP/volume-venv/bin/python" scripts/ashare_research/volume_shock_study.py \
            --seed "$RUNNER_TEMP/volume-seed" --source scripts/ashare_research/source.json \
            --work "$RUNNER_TEMP/volume-input" --output "$RUNNER_TEMP/volume-evidence" \
            2>&1 | tee "$RUNNER_TEMP/volume-evidence/run.log"
      - name: Preserve sources and exactly pack all base trades
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/volume-evidence/source"
          cp scripts/ashare_research/*.py "$RUNNER_TEMP/volume-evidence/source/"
          cp scripts/ashare_research/{source.json,VOLUME_SHOCK_PLAN.md} "$RUNNER_TEMP/volume-evidence/source/"
          printf '%s\n' '${{ github.sha }}' > "$RUNNER_TEMP/volume-evidence/commit.txt"
          if test -f "$RUNNER_TEMP/volume-evidence/base_trades.csv.xz"; then
            "$RUNNER_TEMP/volume-venv/bin/python" scripts/ashare_research/pack_exact.py pack "$RUNNER_TEMP/volume-evidence/base_trades.csv.xz" "$RUNNER_TEMP/volume-evidence/base_trades.exact.zip" > "$RUNNER_TEMP/volume-evidence/packing.json"
            rm "$RUNNER_TEMP/volume-evidence/base_trades.csv.xz"
          fi
          if test -f "$RUNNER_TEMP/volume-evidence/report.md"; then
            cat "$RUNNER_TEMP/volume-evidence/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Experiment incomplete. No new performance acceptance claim.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Enforce unchanged 32 MiB evidence ceiling
        if: always()
        id: budget
        run: |
          python3 -c 'import os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"volume-evidence"; n=sum(f.stat().st_size for f in p.rglob("*") if f.is_file()); print("Evidence bytes:",n); assert n<=33554432, "Evidence exceeds budget; do not delete loss records"'
          echo 'ok=true' >> "$GITHUB_OUTPUT"
      - name: Retain bounded research evidence
        if: always() && steps.budget.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ashare-volume-shock-${{ github.run_id }}
          path: ${{ runner.temp }}/volume-evidence/
          if-no-files-found: error
          retention-days: 3
          compression-level: 9
