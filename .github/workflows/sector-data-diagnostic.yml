name: Diagnose sector data fallbacks

on:
  push:
    branches:
      - fix/sector-history-breadth-focus
    paths:
      - ".github/workflows/sector-data-diagnostic.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/sector-data-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Sina board APIs
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import urllib.parse
          import urllib.request

          HEADERS = {
              "User-Agent": "Mozilla/5.0",
              "Referer": "https://vip.stock.finance.sina.com.cn/",
          }

          def get(url: str, params: dict[str, object] | None = None) -> tuple[int, str, str]:
              if params:
                  url = f"{url}?{urllib.parse.urlencode(params)}"
              request = urllib.request.Request(url, headers=HEADERS)
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      raw = response.read()
                      content_type = response.headers.get("Content-Type", "")
                      for encoding in ("utf-8", "gbk", "gb18030"):
                          try:
                              return response.status, content_type, raw.decode(encoding)
                          except UnicodeDecodeError:
                              pass
                      return response.status, content_type, raw.decode("utf-8", errors="replace")
              except Exception as exc:
                  return 0, type(exc).__name__, str(exc)

          print("=== SINA BOARD OVERVIEW RAW FIELDS ===")
          for param, targets in (
              ("industry", {"医药制造业", "研究和试验发展"}),
              ("class", {"创新药", "机器人概念", "稀缺资源"}),
          ):
              status, content_type, text = get(
                  "https://money.finance.sina.com.cn/q/view/newFLJK.php",
                  {"param": param},
              )
              print("overview", param, status, content_type, "bytes", len(text))
              start, end = text.find("{"), text.rfind("}")
              if start >= 0 and end > start:
                  payload = json.loads(text[start : end + 1])
                  for key, raw in payload.items():
                      fields = str(raw).split(",")
                      if len(fields) > 1 and fields[1].strip() in targets:
                          print("ENTRY", key, fields[1].strip(), "field_count", len(fields))
                          for index, value in enumerate(fields):
                              print(f"  [{index}]={value}")

          print("=== SINA BOARD CONSTITUENT COUNTS ===")
          for node in ("gn_cxy", "hangye_ZC27"):
              status, content_type, text = get(
                  "https://vip.stock.finance.sina.com.cn/quotes_service/api/json_v2.php/Market_Center.getHQNodeStockCount",
                  {"node": node},
              )
              print("count", node, status, content_type, text[:200])
              status, content_type, text = get(
                  "https://vip.stock.finance.sina.com.cn/quotes_service/api/json_v2.php/Market_Center.getHQNodeData",
                  {
                      "page": 1,
                      "num": 5,
                      "sort": "symbol",
                      "asc": 1,
                      "node": node,
                      "symbol": "",
                      "_s_r_a": "page",
                  },
              )
              print("constituents", node, status, content_type, text[:1200])

          print("=== SINA BOARD KLINE ENDPOINTS ===")
          endpoints = (
              (
                  "market-center",
                  "https://vip.stock.finance.sina.com.cn/quotes_service/api/json_v2.php/Market_Center.getKLineData",
                  {"scale": "D", "ma": "no", "datalen": 30},
              ),
              (
                  "cn-market-data",
                  "https://money.finance.sina.com.cn/quotes_service/api/json_v2.php/CN_MarketData.getKLineData",
                  {"scale": 240, "ma": "no", "datalen": 30},
              ),
              (
                  "cn-market-data-service",
                  "https://quotes.sina.cn/cn/api/jsonp_v2.php/var%20_data=/CN_MarketDataService.getKLineData",
                  {"scale": 240, "ma": "no", "datalen": 30},
              ),
          )
          for symbol in ("gn_cxy", "hangye_ZC27", "sh600000"):
              for label, url, base_params in endpoints:
                  params = dict(base_params)
                  params["symbol"] = symbol
                  status, content_type, text = get(url, params)
                  print("kline", label, symbol, status, content_type, "bytes", len(text))
                  print(text[:800].replace("\n", " "))
          PY
