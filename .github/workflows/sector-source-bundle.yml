name: Sector 2+2 source bundle

on:
  push:
    branches:
      - feat/sector-2plus2-monitoring
    paths:
      - ".github/workflows/sector-source-bundle.yml"
  pull_request:
    paths:
      - ".github/workflows/sector-source-bundle.yml"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload isolated source bundle
        uses: actions/upload-artifact@v4
        with:
          name: sector-2plus2-source-${{ github.sha }}
          path: |
            close_review_engine
            .github/workflows/a-share-close-review-ci.yml
            .github/workflows/a-share-close-review.yml
            docs/superpowers/specs/2026-08-21-sector-2plus2-monitoring-design.md
            docs/superpowers/plans/2026-08-21-sector-2plus2-monitoring.md
          if-no-files-found: error
          retention-days: 3
