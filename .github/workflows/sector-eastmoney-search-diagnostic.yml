name: Diagnose Eastmoney focus board lookup

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/sector-eastmoney-search-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-focus-lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe board quote fields and missing focus codes
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import time
          import urllib.parse
          import urllib.request

          HEADERS = {
              "User-Agent": "Mozilla/5.0",
              "Referer": "https://quote.eastmoney.com/center/boardlist.html",
          }

          def get_json(url: str, params: dict[str, object]) -> tuple[int, object]:
              request = urllib.request.Request(
                  f"{url}?{urllib.parse.urlencode(params)}", headers=HEADERS
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return response.status, json.loads(
                          response.read().decode("utf-8", errors="replace")
                      )
              except Exception as exc:
                  return 0, f"{type(exc).__name__}: {exc}"

          token = "D43BF722C8E33BDC906FB84D85E326E8"
          for keyword in ("创新药", "军工", "有色金属"):
              status, payload = get_json(
                  "https://searchapi.eastmoney.com/api/suggest/get",
                  {"input": keyword, "type": 14, "token": token, "count": 30},
              )
              print("SUGGEST", keyword, status, json.dumps(payload, ensure_ascii=False)[:5000])
              time.sleep(0.5)

          quote_fields = (
              "f2,f3,f6,f8,f10,f12,f14,f20,f24,f25,f43,f44,f45,f46,f47,f48,"
              "f49,f50,f57,f58,f59,f60,f104,f105,f109,f110,f124,f128,f136,"
              "f152,f160,f161,f162,f163,f164,f167,f168,f169,f170,f171,f172"
          )
          for host in (
              "https://push2.eastmoney.com/api/qt/stock/get",
              "https://29.push2.eastmoney.com/api/qt/stock/get",
              "https://17.push2.eastmoney.com/api/qt/stock/get",
          ):
              status, payload = get_json(
                  host,
                  {
                      "secid": "90.BK1134",
                      "fields": quote_fields,
                      "ut": "bd1d9ddb04089700cf9c27f6f7426281",
                  },
              )
              print("QUOTE", host, status, json.dumps(payload, ensure_ascii=False)[:6000])
              if status == 200:
                  break
              time.sleep(1.0)

          list_fields = (
              "f2,f3,f6,f8,f10,f12,f14,f20,f24,f25,f104,f105,f109,f110,"
              "f124,f128,f136,f152,f160"
          )
          for host in (
              "https://17.push2.eastmoney.com/api/qt/clist/get",
              "https://29.push2.eastmoney.com/api/qt/clist/get",
              "https://79.push2.eastmoney.com/api/qt/clist/get",
              "https://push2.eastmoney.com/api/qt/clist/get",
          ):
              status, payload = get_json(
                  host,
                  {
                      "pn": 1,
                      "pz": 100,
                      "po": 1,
                      "np": 1,
                      "fltt": 2,
                      "invt": 2,
                      "fid": "f3",
                      "fs": "m:90 t:3 f:!50",
                      "fields": list_fields,
                      "ut": "bd1d9ddb04089700cf9c27f6f7426281",
                  },
              )
              print("ACTIVE", host, status)
              if isinstance(payload, dict):
                  data = payload.get("data") or {}
                  diff = data.get("diff") or []
                  print("total", data.get("total"), "rows", len(diff))
                  for item in diff[:10]:
                      print(json.dumps(item, ensure_ascii=False, sort_keys=True))
              else:
                  print(payload)
              if status == 200:
                  break
              time.sleep(1.0)

          time.sleep(2.0)
          for host in (
              "https://91.push2his.eastmoney.com/api/qt/stock/kline/get",
              "https://92.push2his.eastmoney.com/api/qt/stock/kline/get",
              "https://push2his.eastmoney.com/api/qt/stock/kline/get",
          ):
              status, payload = get_json(
                  host,
                  {
                      "secid": "90.BK1134",
                      "fields1": "f1,f2,f3,f4,f5,f6",
                      "fields2": "f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61",
                      "klt": 101,
                      "fqt": 0,
                      "beg": 0,
                      "end": "20260820",
                      "smplmt": 10000,
                      "lmt": 30,
                  },
              )
              print("HISTORY", host, status)
              if isinstance(payload, dict):
                  data = payload.get("data") or {}
                  rows = data.get("klines") or []
                  print(data.get("name"), len(rows), rows[-3:])
              else:
                  print(payload)
              if status == 200 and isinstance(payload, dict) and payload.get("data"):
                  break
              time.sleep(1.5)
          PY
