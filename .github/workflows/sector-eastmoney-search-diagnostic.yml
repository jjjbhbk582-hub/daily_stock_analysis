name: Diagnose Eastmoney focus board lookup

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/sector-eastmoney-search-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-focus-lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Eastmoney suggestions, quotes and active concept page
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import urllib.parse
          import urllib.request
          from time import sleep

          HEADERS = {
              "User-Agent": "Mozilla/5.0",
              "Referer": "https://quote.eastmoney.com/center/boardlist.html",
          }

          def get_json(url: str, params: dict[str, object]) -> tuple[int, object]:
              request = urllib.request.Request(
                  f"{url}?{urllib.parse.urlencode(params)}", headers=HEADERS
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      raw = response.read().decode("utf-8", errors="replace")
                      return response.status, json.loads(raw)
              except Exception as exc:
                  return 0, f"{type(exc).__name__}: {exc}"

          token = "D43BF722C8E33BDC906FB84D85E326E8"
          keywords = (
              "AI算力", "算力", "CPO", "PCB", "半导体", "存储芯片",
              "稀土", "液冷服务器", "消费电子", "人形机器人",
          )
          resolved: dict[str, list[tuple[str, str, str]]] = {}
          for keyword in keywords:
              status, payload = get_json(
                  "https://searchapi.eastmoney.com/api/suggest/get",
                  {
                      "input": keyword,
                      "type": 14,
                      "token": token,
                      "count": 30,
                  },
              )
              print("SUGGEST", keyword, status)
              print(json.dumps(payload, ensure_ascii=False)[:3000])
              rows = []
              if isinstance(payload, dict):
                  data = payload.get("QuotationCodeTable") or payload.get("Data") or payload.get("data")
                  if isinstance(data, dict):
                      data = data.get("Data") or data.get("data") or []
                  if isinstance(data, list):
                      for item in data:
                          if not isinstance(item, dict):
                              continue
                          code = str(item.get("Code") or item.get("code") or "")
                          name = str(item.get("Name") or item.get("name") or "")
                          classify = str(item.get("Classify") or item.get("classify") or "")
                          if code.upper().startswith("BK"):
                              rows.append((code, name, classify))
              resolved[keyword] = rows
              print("RESOLVED", keyword, rows)
              sleep(0.3)

          print("=== QUOTES AND HISTORY FOR RESOLVED BK CODES ===")
          unique_codes = []
          for rows in resolved.values():
              for code, name, classify in rows:
                  if code not in unique_codes:
                      unique_codes.append(code)
          for code in unique_codes[:20]:
              status, payload = get_json(
                  "https://push2.eastmoney.com/api/qt/stock/get",
                  {
                      "secid": f"90.{code}",
                      "fields": "f2,f3,f6,f8,f12,f14,f20,f104,f105,f124,f128,f136",
                      "ut": "bd1d9ddb04089700cf9c27f6f7426281",
                  },
              )
              print("QUOTE", code, status, json.dumps(payload, ensure_ascii=False)[:1500])
              sleep(0.2)
              status, payload = get_json(
                  "https://91.push2his.eastmoney.com/api/qt/stock/kline/get",
                  {
                      "secid": f"90.{code}",
                      "fields1": "f1,f2,f3,f4,f5,f6",
                      "fields2": "f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61",
                      "klt": 101,
                      "fqt": 0,
                      "beg": 0,
                      "end": "20260820",
                      "smplmt": 10000,
                      "lmt": 30,
                  },
              )
              if isinstance(payload, dict):
                  data = payload.get("data") or {}
                  klines = data.get("klines") or []
                  print("HISTORY", code, status, data.get("name"), len(klines), klines[-2:])
              else:
                  print("HISTORY", code, status, payload)
              sleep(0.3)

          print("=== ACTIVE CONCEPT PAGE ===")
          for host in (
              "https://17.push2.eastmoney.com/api/qt/clist/get",
              "https://push2.eastmoney.com/api/qt/clist/get",
              "https://79.push2.eastmoney.com/api/qt/clist/get",
          ):
              status, payload = get_json(
                  host,
                  {
                      "pn": 1,
                      "pz": 100,
                      "po": 1,
                      "np": 1,
                      "fltt": 2,
                      "invt": 2,
                      "fid": "f3",
                      "fs": "m:90 t:3 f:!50",
                      "fields": "f2,f3,f6,f8,f12,f14,f20,f104,f105,f124,f128,f136",
                      "ut": "bd1d9ddb04089700cf9c27f6f7426281",
                  },
              )
              print("ACTIVE", host, status)
              if isinstance(payload, dict):
                  data = payload.get("data") or {}
                  diff = data.get("diff") or []
                  print(" total", data.get("total"), "rows", len(diff))
                  print([(x.get("f12"), x.get("f14"), x.get("f3"), x.get("f104"), x.get("f105")) for x in diff[:30]])
              else:
                  print(payload)
              if status == 200:
                  break
          PY
